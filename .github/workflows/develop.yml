name: Develop CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validar develop / PR para main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Testes
        run: npm test --if-present

      - name: Build
        run: npm run build

      - name: Verificar erros de tipo
        run: npx tsc --noEmit
